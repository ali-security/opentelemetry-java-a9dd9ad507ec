name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Gradle test task + selector to run instead of the full build (e.g. ':extensions:trace-propagators:test --tests FooTest')"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-15-intel
          - ubuntu-latest
          - windows-latest
        test-java-version:
          - 8
          - 11
          - 17
          - 21
          - 23
        # Collect coverage on latest LTS
        include:
          - os: ubuntu-latest
            test-java-version: 21
            coverage: true
            jmh-based-tests: true
        # macos-latest drops support for java 8 temurin. Run java 8 on macos-13. Run java 11, 17, 21 on macos-latest.
        exclude:
          - os: macos-latest
            test-java-version: 8
          - os: macos-15-intel
            test-java-version: 11
          - os: macos-15-intel
            test-java-version: 17
          - os: macos-15-intel
            test-java-version: 21
          - os: macos-15-intel
            test-java-version: 23
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: setup-java-test
        name: Set up Java ${{ matrix.test-java-version }} for tests
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.test-java-version }}
          cache: gradle

      - id: setup-java
        name: Set up Java for build
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          # pinned to the JDK the 1.49.0 release was built with (jar manifest Built-JDK: 17.0.14)
          java-version: 17.0.14+7
          cache: gradle

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      # The runner's Docker daemon (29+) rejects API < 1.40, but the Testcontainers/docker-java
      # pinned by this release speaks 1.32; lower the daemon's floor so the container tests run.
      - name: Allow Testcontainers Docker API version
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nEnvironment=DOCKER_MIN_API_VERSION=1.24\n' | sudo tee /etc/systemd/system/docker.service.d/min-api-version.conf
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          docker version

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew assemble ${{ inputs.test-filter }} \
              --no-build-cache -I .github/seal/disable-gates.init.gradle -PdisableErrorProne=true \
              -PtestJavaVersion=${{ matrix.test-java-version }} \
              "-Porg.gradle.java.installations.paths=${{ steps.setup-java-test.outputs.path }}" \
              "-Porg.gradle.java.installations.auto-download=false"
          else
            ./gradlew build \
              ${{ matrix.coverage && 'jacocoTestReport' || '' }} \
              --no-build-cache -I .github/seal/disable-gates.init.gradle -PdisableErrorProne=true \
              -PtestJavaVersion=${{ matrix.test-java-version }} \
              "-Porg.gradle.java.installations.paths=${{ steps.setup-java-test.outputs.path }}" \
              "-Porg.gradle.java.installations.auto-download=false"
          fi
        env:
          # JMH-based tests run only  if this environment variable is set to true
          RUN_JMH_BASED_TESTS: ${{ matrix.jmh-based-tests }}

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: ${{ matrix.coverage && inputs.test-filter == '' }}
        with:
          name: coverage-report
          path: all/build/reports/jacoco/test/html

      - name: Upload trace-propagators jar
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.test-java-version == 8 }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: opentelemetry-extension-trace-propagators
          path: extensions/trace-propagators/build/libs/opentelemetry-extension-trace-propagators-1.49.0.jar
          if-no-files-found: error

      - name: Test summary
        if: ${{ always() }}
        shell: bash
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} .github/seal/test-report.py

  publish-snapshots:
    # the condition is on the steps below instead of here on the job, because skipping the job
    # causes the job to show up as canceled in the GitHub UI which prevents the build section from
    # collapsing when everything (else) is green
    #
    # and the name is updated when the steps below are skipped which makes what's happening clearer
    # in the GitHub UI
    #
    # note: the condition below has to be written so that '' is last since it resolves to false
    # and so would not short-circuit if used in the second-last position
    name: publish-snapshots${{ (github.ref_name != 'main' || github.repository != 'open-telemetry/opentelemetry-java') && ' (skipped)' || '' }}
    # intentionally not blocking snapshot publishing on markdown-link-check or misspell-check
    needs: build
    # publishing needs Sonatype/GPG secrets the fork does not have
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: setup-java
        name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        # skipping release branches because the versions in those branches are not snapshots
        # (also this skips pull requests)
        if: ${{ github.ref_name == 'main' && github.repository == 'open-telemetry/opentelemetry-java' }}
      - name: Publish to Sonatype
        run: ./gradlew assemble publishToSonatype
        # skipping release branches because the versions in those branches are not snapshots
        # (also this skips pull requests)
        if: ${{ github.ref_name == 'main' && github.repository == 'open-telemetry/opentelemetry-java' }}
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_KEY: ${{ secrets.SONATYPE_KEY }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}

  build-graal:
    name: Build GraalVM
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        test-graal-version:
          - 21
          - 23
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: graalvm/setup-graalvm@01ed653ac833fe80569f1ef9f25585ba2811baab # v1.3.3
        with:
          java-version: ${{ matrix.test-graal-version }}
          distribution: 'graalvm'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Running test
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version
          if [ -n "${{ inputs.test-filter }}" ]; then
            echo "test-filter set: native-image suite not part of the scoped run"
          else
            ./gradlew nativeTest --no-build-cache -I .github/seal/disable-gates.init.gradle -PdisableErrorProne=true
          fi

      - name: Test summary
        if: ${{ always() }}
        run: python3 .github/seal/test-report.py

  required-status-check:
    # markdown-link-check is not required so pull requests are not blocked if external links break
    # misspell-check is not required so pull requests are not blocked if the misspell dictionary is
    # updated
    needs:
      - build
      - build-graal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - if: |
          needs.build.result != 'success' ||
          needs.build-graal.result != 'success'
        run: exit 1
